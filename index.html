<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a1a2e">
<title>Školní zápisník</title>
<style>
  :root {
    --primary: #4f6ef7; --primary-dark: #3a56d4;
    --bg: #0f0f1a; --bg2: #1a1a2e; --bg3: #252540; --bg4: #30305a;
    --text: #e8e8f5; --text2: #9090b8; --text3: #5a5a7a;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
    --danger: #e74c3c; --radius: 16px; --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  .view { display: none; height: 100vh; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }
  .btn-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
  .btn-icon:active { background: var(--bg4); }
  .scroll { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

  /* HOME */
  .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .subject-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; cursor: pointer; transition: transform 0.15s, background 0.15s; position: relative; overflow: hidden; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; }
  .subject-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--card-color, var(--primary)); }
  .subject-card:active { transform: scale(0.97); background: var(--bg3); }
  .subject-icon { font-size: 32px; margin-bottom: 8px; }
  .subject-name { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .subject-counts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .count-pill { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: rgba(255,255,255,0.06); color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .add-subject-btn { background: transparent; border: 2px dashed var(--border2); border-radius: var(--radius); min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--text2); font-size: 14px; }
  .add-subject-btn:active { border-color: var(--primary); color: var(--primary); }
  .add-subject-btn span { font-size: 28px; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; overflow-x: auto; }
  .tab { flex: 1; min-width: 0; padding: 13px 6px; text-align: center; font-size: 12px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; font-weight: 500; white-space: nowrap; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .tab-panel.active { display: block; }

  /* AUDIO */
  .record-zone { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 16px; }
  .record-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--danger); color: white; font-size: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto 16px; transition: transform 0.15s; box-shadow: 0 0 0 0 rgba(231,76,60,0.4); }
  .record-btn.recording { animation: pulse 1.2s infinite; background: #c0392b; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(231,76,60,0.5)} 70%{box-shadow:0 0 0 16px rgba(231,76,60,0)} 100%{box-shadow:0 0 0 0 rgba(231,76,60,0)} }
  .record-btn:active { transform: scale(0.93); }
  .record-status { font-size: 14px; color: var(--text2); }
  .record-time { font-size: 28px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; margin: 8px 0; }
  .upload-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: 1px dashed var(--border2); background: transparent; color: var(--text2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; }
  .upload-btn:active { border-color: var(--primary); color: var(--primary); }
  .audio-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .audio-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .audio-item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .audio-item-name { flex: 1; font-size: 13px; font-weight: 500; }
  .audio-item-date { font-size: 11px; color: var(--text3); }
  audio { width: 100%; height: 36px; }

  /* NOTES */
  .note-editor { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .note-editor textarea { width: 100%; min-height: 120px; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; line-height: 1.7; resize: none; font-family: inherit; }
  .note-editor textarea::placeholder { color: var(--text3); }
  .note-editor input[type="date"],.note-editor input[type="time"],.note-editor input[type="text"] { transition: border-color 0.15s; }
  .note-editor input:focus { border-color: var(--primary) !important; outline: none; }
  .editor-toolbar { display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; flex-wrap: wrap; }
  .btn-primary { padding: 10px 20px; border-radius: var(--radius-sm); border: none; background: var(--primary); color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-secondary { padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: transparent; color: var(--text); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-secondary:active { background: var(--bg3); }
  .spacer { flex: 1; }

  .note-list { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
  .note-group-header { display: flex; align-items: center; gap: 10px; padding: 18px 4px 8px; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .note-group-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .note-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; transition: border-color 0.15s; }
  .note-item:hover { border-color: var(--border2); }
  .note-item-meta { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .note-item-date { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .note-topic-badge { font-size: 12px; font-weight: 600; color: var(--primary); background: rgba(79,110,247,0.12); border: 1px solid rgba(79,110,247,0.2); border-radius: 6px; padding: 3px 10px; line-height: 1.4; flex: 1; min-width: 0; }
  .note-item-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .note-text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  .note-text.collapsed { max-height: 80px; overflow: hidden; }
  .show-more { font-size: 12px; color: var(--primary); cursor: pointer; margin-top: 6px; display: inline-block; }

  /* DRAW TAB */
  #tab-draw { display: none; flex-direction: column; padding: 0; overflow: hidden; }
  #tab-draw.active { display: flex; }
  .draw-toolbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
  .tool-btn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.12s, border-color 0.12s; flex-shrink: 0; }
  .tool-btn.active { background: var(--primary); border-color: var(--primary); }
  .tool-btn:active { transform: scale(0.93); }
  .sep { width: 1px; height: 32px; background: var(--border2); flex-shrink: 0; }
  .color-strip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .draw-color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.12s, border-color 0.12s; flex-shrink: 0; }
  .draw-color-dot.active { border-color: white; transform: scale(1.18); }
  .custom-color-wrap { position: relative; width: 28px; height: 28px; flex-shrink: 0; }
  .custom-color-wrap input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; }
  .custom-color-wrap .custom-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--border2); display: flex; align-items: center; justify-content: center; font-size: 14px; pointer-events: none; }
  .size-wrap { display: flex; align-items: center; gap: 8px; }
  .size-wrap input[type="range"] { width: 80px; height: 4px; border-radius: 2px; accent-color: var(--primary); cursor: pointer; }
  .size-label { font-size: 12px; color: var(--text2); min-width: 20px; text-align: right; }
  .opacity-wrap { display: flex; align-items: center; gap: 8px; }
  .opacity-wrap input[type="range"] { width: 70px; height: 4px; border-radius: 2px; accent-color: var(--primary); cursor: pointer; }
  .canvas-wrap { flex: 1; overflow: auto; background: #1c1c2e; position: relative; -webkit-overflow-scrolling: touch; }
  #draw-canvas { display: block; cursor: crosshair; touch-action: none; background: white; }
  .draw-bottom { background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  .draw-list { display: flex; flex-direction: column; gap: 10px; }
  .draw-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .draw-item-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .draw-item-date { font-size: 11px; color: var(--text3); flex: 1; }
  .draw-item img { width: 100%; display: block; background: white; }
  #draw-panel { padding: 16px; overflow-y: auto; flex: 1; }
  .canvas-bg-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
  .canvas-bg-row select { padding: 6px 10px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-size: 13px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow); animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 12px 14px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; outline: none; }
  .form-group input:focus { border-color: var(--primary); }
  .color-picker { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
  .color-dot.selected { border-color: white; transform: scale(1.15); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions .btn-primary { flex: 1; padding: 14px; font-size: 15px; }
  .btn-cancel { padding: 14px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: transparent; color: var(--text2); font-size: 15px; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--bg4); border: 1px solid var(--border2); border-radius: 30px; padding: 12px 24px; font-size: 14px; font-weight: 500; z-index: 200; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; box-shadow: var(--shadow); }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* OFFLINE + INSTALL */
  .offline-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 300; background: #e67e22; color: white; text-align: center; font-size: 13px; font-weight: 600; padding: 7px 16px; transform: translateY(-100%); transition: transform 0.3s ease; }
  .offline-bar.show { transform: translateY(0); }
  .install-btn { position: fixed; bottom: 24px; right: 20px; z-index: 250; background: var(--primary); color: white; border: none; border-radius: 30px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); display: none; align-items: center; gap: 8px; }
  .install-btn.show { display: flex; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .subject-manage { display: flex; flex-direction: column; gap: 10px; }
  .manage-item { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .manage-item-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .manage-item-name { flex: 1; font-size: 15px; }
  .manage-item-counts { font-size: 12px; color: var(--text2); }
  .btn-danger-sm { padding: 6px 10px; border-radius: 6px; border: none; background: rgba(231,76,60,0.15); color: var(--danger); font-size: 12px; cursor: pointer; }
  .btn-danger-sm:active { background: rgba(231,76,60,0.3); }

  @media (max-width: 500px) { .subjects-grid { grid-template-columns: repeat(2,1fr); } }
  @media (min-width: 900px) { .subjects-grid { grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); } }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
  .badge-record { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--danger); background: rgba(231,76,60,0.12); padding: 3px 10px; border-radius: 20px; margin-left: 8px; }
  .badge-record::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="offline-bar" id="offline-bar">📵 Offline — aplikace funguje ze zálohy</div>
<button class="install-btn" id="install-btn" onclick="installApp()">⬇️ Nainstalovat</button>

<!-- HOME -->
<div class="view active" id="view-home">
  <div class="header">
    <div style="font-size:26px">📚</div>
    <h1>Školní zápisník</h1>
    <button class="btn-icon" onclick="openManage()">⚙️</button>
    <button class="btn-icon" onclick="openAddSubject()">➕</button>
  </div>
  <div class="scroll"><div class="subjects-grid" id="subjects-grid"></div></div>
</div>

<!-- SUBJECT -->
<div class="view" id="view-subject">
  <div class="header">
    <button class="btn-icon" onclick="goHome()">←</button>
    <h1 id="subject-title">Předmět</h1>
    <button class="btn-icon" id="btn-edit-subject">✏️</button>
    <button class="btn-icon" id="btn-delete-subject" style="background:rgba(231,76,60,0.12);border-color:rgba(231,76,60,0.3);color:var(--danger)">🗑️</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('audio')">🎙️ Nahrávky</div>
    <div class="tab" onclick="switchTab('notes')">📝 Zápisky</div>
    <div class="tab" onclick="switchTab('draw')">✏️ Kresba</div>
  </div>

  <!-- AUDIO -->
  <div class="tab-panel active" id="tab-audio">
    <div class="record-zone">
      <div class="record-btn" id="record-btn" onclick="toggleRecord()">🎙️</div>
      <div class="record-time" id="record-time">0:00</div>
      <div class="record-status" id="record-status">Klepni pro zahájení nahrávání</div>
    </div>
    <button class="upload-btn" onclick="document.getElementById('audio-file-input').click()">
      <span>📂</span> Importovat MP3 / audio soubor
    </button>
    <input type="file" id="audio-file-input" accept="audio/*" onchange="importAudio(event)">
    <div class="audio-list" id="audio-list"></div>
  </div>

  <!-- NOTES -->
  <div class="tab-panel" id="tab-notes">
    <div class="note-editor">
      <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:130px;">
          <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">📅 Datum hodiny</label>
          <input type="date" id="note-date" style="width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;color-scheme:dark;">
        </div>
        <div style="flex:0 0 105px;">
          <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">⏰ Čas</label>
          <input type="time" id="note-time" style="width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;color-scheme:dark;">
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">📌 Téma hodiny</label>
        <input type="text" id="note-topic" placeholder="např. Pythagorova věta…" maxlength="100"
          style="width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;">
      </div>
      <div style="margin-bottom:4px;">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">📝 Poznámky</label>
        <textarea id="note-textarea" placeholder="Napiš zápisek z hodiny…" rows="5"></textarea>
      </div>
      <div class="editor-toolbar">
        <button class="btn-secondary" onclick="document.getElementById('note-file-input').click()">📂 Ze souboru</button>
        <input type="file" id="note-file-input" accept=".txt,.md,text/*" onchange="importNote(event)">
        <div class="spacer"></div>
        <button class="btn-primary" onclick="saveNote()">Uložit zápisek</button>
      </div>
    </div>
    <div id="note-list"></div>
  </div>

  <!-- DRAW -->
  <div class="tab-panel" id="tab-draw">
    <div class="draw-toolbar">
      <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')" title="Pero">🖊️</button>
      <button class="tool-btn" id="tool-marker" onclick="setTool('marker')" title="Zvýrazňovač">🖍️</button>
      <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="Guma">🧹</button>
      <button class="tool-btn" id="tool-line" onclick="setTool('line')" title="Přímka">╱</button>
      <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="Obdélník">▭</button>
      <button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="Elipsa">◯</button>
      <div class="sep"></div>
      <button class="tool-btn" onclick="undoDraw()" title="Zpět">↩️</button>
      <button class="tool-btn" onclick="redoDraw()" title="Znovu">↪️</button>
      <button class="tool-btn" onclick="clearCanvas()" title="Smazat vše" style="color:var(--danger)">🗑️</button>
      <div class="sep"></div>
      <div class="size-wrap">
        <span style="font-size:12px;color:var(--text2)">Tl.</span>
        <input type="range" id="brush-size" min="1" max="40" value="4" oninput="updateBrushSize(this.value)">
        <span class="size-label" id="size-label">4</span>
      </div>
      <div class="sep"></div>
      <div class="opacity-wrap" id="opacity-group">
        <span style="font-size:12px;color:var(--text2)">🫧</span>
        <input type="range" id="brush-opacity" min="10" max="100" value="100" oninput="updateOpacity(this.value)">
        <span class="size-label" id="opacity-label">100%</span>
      </div>
    </div>
    <div class="draw-toolbar" style="padding:8px 12px;">
      <span style="font-size:12px;color:var(--text2);flex-shrink:0">Barva:</span>
      <div class="color-strip" id="draw-color-strip"></div>
      <div class="custom-color-wrap" title="Vlastní barva">
        <input type="color" id="custom-color-input" value="#ff0000" oninput="setCustomColor(this.value)">
        <div class="custom-dot">🎨</div>
      </div>
      <div class="sep"></div>
      <div class="canvas-bg-row">
        <span>Pozadí:</span>
        <select id="canvas-bg-sel" onchange="changeCanvasBg(this.value)">
          <option value="white">Bílé</option>
          <option value="#fdf6e3">Béžové</option>
          <option value="lined">Linky</option>
          <option value="grid">Mřížka</option>
          <option value="#1a1a2e">Tmavé</option>
        </select>
      </div>
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="draw-canvas"></canvas>
    </div>
    <div class="draw-bottom">
      <span style="font-size:13px;color:var(--text2);flex:1">Pero / prst / stylus</span>
      <button class="btn-secondary" onclick="saveDrawing()">💾 Uložit kresbu</button>
    </div>
    <div id="draw-panel"><div class="draw-list" id="draw-list"></div></div>
  </div>
</div>

<!-- MANAGE -->
<div class="view" id="view-manage">
  <div class="header">
    <button class="btn-icon" onclick="goHome()">←</button>
    <h1>Správa předmětů</h1>
    <button class="btn-icon" onclick="openAddSubject()">➕</button>
  </div>
  <div class="scroll"><div class="subject-manage" id="manage-list"></div></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-subject">
  <div class="modal">
    <h2 id="modal-title">Nový předmět</h2>
    <div class="form-group">
      <label>Název předmětu</label>
      <input type="text" id="input-subject-name" placeholder="např. Matematika" maxlength="40">
    </div>
    <div class="form-group">
      <label>Ikona</label>
      <div class="color-picker" id="icon-picker"></div>
    </div>
    <div class="form-group">
      <label>Barva</label>
      <div class="color-picker" id="color-picker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Zrušit</button>
      <button class="btn-primary" onclick="saveSubject()">Uložit</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ══
const ICONS = ['📚','📖','📐','📏','🔬','🧪','🌍','🗺️','📜','⚛️','🎨','🎵','💻','🏃','✏️','📊','🔭','🌿','🧬','🏛️'];
const COLORS = ['#4f6ef7','#e74c3c','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00bcd4','#ff5722','#607d8b'];
const DRAW_COLORS = ['#000000','#ffffff','#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#795548','#607d8b'];

// ══ STATE ══
let subjects = JSON.parse(localStorage.getItem('subjects') || '[]');
let currentSubjectId = null, editingSubjectId = null;
let selectedIcon = ICONS[0], selectedColor = COLORS[0];
let mediaRecorder = null, audioChunks = [], recordInterval = null, recordSeconds = 0, isRecording = false;
let canvas, ctx, currentTool = 'pen', drawColor = '#222222', brushSize = 4, brushOpacity = 1.0;
let isDrawing = false, lastX = 0, lastY = 0, undoStack = [], redoStack = [];
let shapeStart = null, snapshotBeforeShape = null, canvasBg = 'white';

function save() { localStorage.setItem('subjects', JSON.stringify(subjects)); }
function getSubject(id) { return subjects.find(s => s.id === id); }

// ══ VIEWS ══
function showView(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function goHome() { stopRecordingIfActive(); showView('view-home'); renderHome(); }
function openManage() { showView('view-manage'); renderManage(); }

// ══ HOME ══
function renderHome() {
  const grid = document.getElementById('subjects-grid');
  grid.innerHTML = '';
  subjects.forEach(s => {
    const div = document.createElement('div');
    div.className = 'subject-card';
    div.style.setProperty('--card-color', s.color);
    div.innerHTML = `<div><div class="subject-icon">${s.icon}</div><div class="subject-name">${escHtml(s.name)}</div></div>
      <div class="subject-counts">
        <div class="count-pill">🎙️ ${(s.recordings||[]).length}</div>
        <div class="count-pill">📝 ${(s.notes||[]).length}</div>
        <div class="count-pill">✏️ ${(s.drawings||[]).length}</div>
      </div>`;
    div.onclick = () => openSubject(s.id);
    grid.appendChild(div);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'add-subject-btn';
  addBtn.innerHTML = '<span>➕</span>Přidat předmět';
  addBtn.onclick = openAddSubject;
  grid.appendChild(addBtn);
}

// ══ SUBJECT ══
function openSubject(id) {
  currentSubjectId = id;
  const s = getSubject(id); if (!s) return;
  document.getElementById('subject-title').textContent = s.icon + ' ' + s.name;
  document.getElementById('btn-edit-subject').onclick = () => openEditSubject(id);
  document.getElementById('btn-delete-subject').onclick = () => deleteSubject(id);
  switchTab('audio');
  showView('view-subject');
  renderAudioList(); renderNoteList(); renderDrawList();
}
function switchTab(name) {
  const names = ['audio','notes','draw'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', names[i] === name));
  document.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', names[i] === name));
  if (name !== 'audio') stopRecordingIfActive();
  if (name === 'draw') initCanvas();
  if (name === 'notes') setNoteDefaultDate();
}

// ══ AUDIO ══
async function toggleRecord() { isRecording ? stopRecording() : await startRecording(); }
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = []; recordSeconds = 0; updateRecordTimer();
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => { saveRecording(new Blob(audioChunks, { type: mimeType }), 'Nahrávka ' + formatDate(new Date())); stream.getTracks().forEach(t => t.stop()); };
    mediaRecorder.start(1000); isRecording = true;
    const btn = document.getElementById('record-btn');
    btn.classList.add('recording'); btn.textContent = '⏹️';
    document.getElementById('record-status').innerHTML = 'Nahrávání… <span class="badge-record">LIVE</span>';
    recordInterval = setInterval(() => { recordSeconds++; updateRecordTimer(); }, 1000);
  } catch(err) { showToast('❌ Mikrofon nedostupný: ' + err.message); }
}
function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  clearInterval(recordInterval); isRecording = false;
  const btn = document.getElementById('record-btn');
  btn.classList.remove('recording'); btn.textContent = '🎙️';
  document.getElementById('record-status').textContent = 'Klepni pro zahájení nahrávání';
  document.getElementById('record-time').textContent = '0:00';
}
function stopRecordingIfActive() { if (isRecording) stopRecording(); }
function updateRecordTimer() { const m=Math.floor(recordSeconds/60),s=recordSeconds%60; document.getElementById('record-time').textContent=m+':'+String(s).padStart(2,'0'); }
function saveRecording(blob, name) {
  const reader = new FileReader();
  reader.onload = () => {
    const s = getSubject(currentSubjectId); if (!s) return;
    s.recordings = s.recordings || [];
    s.recordings.unshift({ id: uid(), name, date: new Date().toISOString(), dataUrl: reader.result, mimeType: blob.type });
    save(); renderAudioList(); showToast('✅ Nahrávka uložena');
  };
  reader.readAsDataURL(blob);
}
function importAudio(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const s = getSubject(currentSubjectId); if (!s) return;
    s.recordings = s.recordings || [];
    s.recordings.unshift({ id: uid(), name: file.name.replace(/\.[^.]+$/,''), date: new Date().toISOString(), dataUrl: reader.result, mimeType: file.type });
    save(); renderAudioList(); showToast('✅ Importováno: ' + file.name);
  };
  reader.readAsDataURL(file); e.target.value = '';
}
function renderAudioList() {
  const s = getSubject(currentSubjectId);
  const list = document.getElementById('audio-list');
  const recs = (s && s.recordings) ? s.recordings : [];
  if (!recs.length) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">🎙️</div><p>Žádné nahrávky.<br>Začni nahrávat nebo importuj soubor.</p></div>'; return; }
  list.innerHTML = recs.map(r => `<div class="audio-item">
    <div class="audio-item-header">
      <span style="font-size:18px">🎵</span>
      <div><div class="audio-item-name">${escHtml(r.name)}</div><div class="audio-item-date">${formatDate(new Date(r.date))}</div></div>
      <button class="btn-danger-sm" onclick="deleteRecording('${r.id}')">🗑️</button>
    </div>
    <audio controls src="${r.dataUrl}" preload="none"></audio>
  </div>`).join('');
}
function deleteRecording(rid) {
  const s = getSubject(currentSubjectId); if (!s) return;
  s.recordings = (s.recordings||[]).filter(r => r.id !== rid);
  save(); renderAudioList(); showToast('🗑️ Nahrávka smazána');
}

// ══ NOTES ══
function todayISO() { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function setNoteDefaultDate() { const el=document.getElementById('note-date'); if (el && !el.value) el.value=todayISO(); }
function saveNote() {
  const text = document.getElementById('note-textarea').value.trim();
  if (!text) { showToast('⚠️ Zápisek je prázdný'); return; }
  const dateVal = document.getElementById('note-date').value || todayISO();
  const timeVal = document.getElementById('note-time').value || '';
  const topic = document.getElementById('note-topic').value.trim();
  const s = getSubject(currentSubjectId); if (!s) return;
  s.notes = s.notes || [];
  s.notes.unshift({ id: uid(), text, topic, lessonDate: dateVal, lessonTime: timeVal, date: new Date().toISOString() });
  save();
  document.getElementById('note-textarea').value = '';
  document.getElementById('note-topic').value = '';
  document.getElementById('note-time').value = '';
  document.getElementById('note-date').value = todayISO();
  renderNoteList(); showToast('✅ Zápisek uložen');
}
function importNote(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const existing = document.getElementById('note-textarea').value;
    document.getElementById('note-textarea').value = existing + (existing ? '\n\n---\n\n' : '') + reader.result;
    showToast('📂 Soubor vložen do editoru');
  };
  reader.readAsText(file); e.target.value = '';
}
function renderNoteList() {
  const s = getSubject(currentSubjectId);
  const list = document.getElementById('note-list');
  const notes = (s && s.notes) ? s.notes : [];
  if (!notes.length) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>Žádné zápisky.</p></div>'; return; }
  const groups = {};
  notes.forEach(n => { const key = n.lessonDate || n.date.slice(0,10); if (!groups[key]) groups[key]=[]; groups[key].push(n); });
  const sortedKeys = Object.keys(groups).sort((a,b) => b.localeCompare(a));
  list.innerHTML = sortedKeys.map(key => {
    const dayLabel = formatLessonDate(key);
    const items = groups[key].map(n => {
      const isLong = n.text.length > 280;
      const timeStr = n.lessonTime ? ' · ' + n.lessonTime : '';
      const topicHtml = n.topic ? `<div class="note-topic-badge">📌 ${escHtml(n.topic)}</div>` : '';
      return `<div class="note-item">
        <div class="note-item-meta">
          <div class="note-item-date">🗓️ ${dayLabel}${timeStr}</div>
          ${topicHtml}
          <div class="note-item-actions">
            <button class="btn-secondary" style="padding:5px 9px;font-size:12px" onclick="editNote('${n.id}')">✏️</button>
            <button class="btn-danger-sm" onclick="deleteNote('${n.id}')">🗑️</button>
          </div>
        </div>
        <div class="note-text${isLong?' collapsed':''}" id="note-text-${n.id}">${escHtml(n.text)}</div>
        ${isLong?`<span class="show-more" onclick="toggleNote('${n.id}',this)">Zobrazit vše ▾</span>`:''}
      </div>`;
    }).join('');
    return `<div class="note-group-header">${dayLabel}</div>${items}`;
  }).join('');
}
function formatLessonDate(isoDate) {
  const p = isoDate.split('-');
  if (p.length !== 3) return isoDate;
  const d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  return d.toLocaleDateString('cs-CZ', { weekday:'short', day:'2-digit', month:'long', year:'numeric' });
}
function toggleNote(id, btn) {
  const el = document.getElementById('note-text-'+id);
  el.classList.toggle('collapsed');
  btn.textContent = el.classList.contains('collapsed') ? 'Zobrazit vše ▾' : 'Méně ▴';
}
function editNote(nid) {
  const s = getSubject(currentSubjectId); if (!s) return;
  const n = (s.notes||[]).find(x => x.id === nid); if (!n) return;
  document.getElementById('note-date').value = n.lessonDate || n.date.slice(0,10);
  document.getElementById('note-time').value = n.lessonTime || '';
  document.getElementById('note-topic').value = n.topic || '';
  document.getElementById('note-textarea').value = n.text;
  s.notes = s.notes.filter(x => x.id !== nid);
  save(); renderNoteList();
  document.querySelector('#tab-notes').scrollTo(0,0);
  document.getElementById('note-topic').focus();
  showToast('✏️ Zápisek načten k úpravě');
}
function deleteNote(nid) {
  const s = getSubject(currentSubjectId); if (!s) return;
  s.notes = (s.notes||[]).filter(n => n.id !== nid);
  save(); renderNoteList(); showToast('🗑️ Zápisek smazán');
}

// ══ DRAWING ══
function initCanvas() {
  canvas = document.getElementById('draw-canvas');
  ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvas-wrap');
  const W = Math.max(wrap.clientWidth, 1200), H = Math.max(wrap.clientHeight - 4, 850);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; applyCanvasBg(); }
  buildDrawColorStrip();
  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
}
function applyCanvasBg() {
  if (!ctx) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (canvasBg === 'lined') {
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#c5cae9'; ctx.lineWidth=1;
    for (let y=40;y<canvas.height;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    ctx.strokeStyle='#ef9a9a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(80,0); ctx.lineTo(80,canvas.height); ctx.stroke();
  } else if (canvasBg === 'grid') {
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=1;
    for (let x=0;x<canvas.width;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for (let y=0;y<canvas.height;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  } else { ctx.fillStyle=canvasBg; ctx.fillRect(0,0,canvas.width,canvas.height); }
  undoStack=[]; redoStack=[]; pushUndo();
}
function changeCanvasBg(val) { canvasBg=val; applyCanvasBg(); }
function pushUndo() { if (!ctx) return; undoStack.push(canvas.toDataURL()); if (undoStack.length>40) undoStack.shift(); redoStack=[]; }
function undoDraw() {
  if (undoStack.length<=1){showToast('⚠️ Nelze jít dál zpět');return;}
  redoStack.push(undoStack.pop());
  const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);}; img.src=undoStack[undoStack.length-1];
}
function redoDraw() {
  if (!redoStack.length){showToast('⚠️ Nic k opakování');return;}
  const url=redoStack.pop(); undoStack.push(url);
  const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);}; img.src=url;
}
function clearCanvas() { if (!ctx) return; pushUndo(); applyCanvasBg(); showToast('🗑️ Plátno vymazáno'); }
function getPos(e) {
  const rect=canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(canvas.width/rect.width), y:(e.clientY-rect.top)*(canvas.height/rect.height) };
}
function onPointerDown(e) {
  e.preventDefault(); canvas.setPointerCapture(e.pointerId); isDrawing=true;
  const pos=getPos(e); lastX=pos.x; lastY=pos.y;
  if (['line','rect','circle'].includes(currentTool)) {
    snapshotBeforeShape=ctx.getImageData(0,0,canvas.width,canvas.height); shapeStart={x:pos.x,y:pos.y};
  } else {
    ctx.beginPath(); ctx.moveTo(pos.x,pos.y);
    if (currentTool==='pen'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=brushOpacity;ctx.strokeStyle=drawColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';}
    else if (currentTool==='marker'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=0.35;ctx.strokeStyle=drawColor;ctx.lineWidth=brushSize*3;ctx.lineCap='square';ctx.lineJoin='round';}
    else if (currentTool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.lineWidth=brushSize*3;ctx.lineCap='round';ctx.lineJoin='round';}
  }
}
function onPointerMove(e) {
  if (!isDrawing) return; e.preventDefault();
  const pos=getPos(e);
  if (['line','rect','circle'].includes(currentTool)) {
    ctx.putImageData(snapshotBeforeShape,0,0);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=brushOpacity;ctx.strokeStyle=drawColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    if (currentTool==='line'){ctx.moveTo(shapeStart.x,shapeStart.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();}
    else if (currentTool==='rect'){ctx.strokeRect(shapeStart.x,shapeStart.y,pos.x-shapeStart.x,pos.y-shapeStart.y);}
    else{const rx=Math.abs(pos.x-shapeStart.x)/2,ry=Math.abs(pos.y-shapeStart.y)/2,cx=(shapeStart.x+pos.x)/2,cy=(shapeStart.y+pos.y)/2;ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();}
  } else { ctx.lineTo(pos.x,pos.y);ctx.stroke();ctx.beginPath();ctx.moveTo(pos.x,pos.y); }
  lastX=pos.x; lastY=pos.y;
}
function onPointerUp(e) { if (!isDrawing) return; isDrawing=false; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; shapeStart=null; snapshotBeforeShape=null; pushUndo(); }
function setTool(tool) {
  currentTool=tool;
  document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('tool-'+tool); if (btn) btn.classList.add('active');
  document.getElementById('opacity-group').style.opacity=(tool==='eraser')?'0.3':'1';
}
function setDrawColor(color) {
  drawColor=color;
  document.querySelectorAll('.draw-color-dot').forEach(d=>d.classList.remove('active'));
  const m=document.querySelector(`.draw-color-dot[data-color="${CSS.escape(color)}"]`); if (m) m.classList.add('active');
  if (currentTool==='eraser') setTool('pen');
}
function setCustomColor(color) { drawColor=color; document.querySelectorAll('.draw-color-dot').forEach(d=>d.classList.remove('active')); if (currentTool==='eraser') setTool('pen'); }
function buildDrawColorStrip() {
  const strip=document.getElementById('draw-color-strip');
  if (!strip||strip.children.length>0) return;
  DRAW_COLORS.forEach(c=>{
    const d=document.createElement('div');
    d.className='draw-color-dot'+(c===drawColor?' active':'');
    d.style.background=c; d.style.border=c==='#ffffff'?'2px solid #ccc':'2px solid transparent'; d.dataset.color=c;
    d.onclick=()=>setDrawColor(c); strip.appendChild(d);
  });
}
function updateBrushSize(v){brushSize=parseInt(v);document.getElementById('size-label').textContent=v;}
function updateOpacity(v){brushOpacity=parseInt(v)/100;document.getElementById('opacity-label').textContent=v+'%';}
function saveDrawing() {
  if (!canvas) return;
  const s=getSubject(currentSubjectId); if (!s) return;
  s.drawings=s.drawings||[];
  s.drawings.unshift({id:uid(),date:new Date().toISOString(),dataUrl:canvas.toDataURL('image/png')});
  save(); renderDrawList(); showToast('💾 Kresba uložena');
}
function renderDrawList() {
  const s=getSubject(currentSubjectId);
  const list=document.getElementById('draw-list'); if (!list) return;
  const drawings=(s&&s.drawings)?s.drawings:[];
  if (!drawings.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">✏️</div><p>Žádné kresby.</p></div>';return;}
  list.innerHTML=drawings.map(d=>`<div class="draw-item">
    <div class="draw-item-header">
      <span>🖼️</span>
      <div class="draw-item-date">📅 ${formatDate(new Date(d.date))}</div>
      <a href="${d.dataUrl}" download="kresba-${d.id}.png"><button class="btn-secondary" style="padding:6px 10px;font-size:12px">⬇️ PNG</button></a>
      <button class="btn-secondary" style="padding:6px 10px;font-size:12px" onclick="loadDrawing('${d.id}')">📂 Načíst</button>
      <button class="btn-danger-sm" onclick="deleteDrawing('${d.id}')">🗑️</button>
    </div>
    <img src="${d.dataUrl}" loading="lazy" alt="Kresba">
  </div>`).join('');
}
function loadDrawing(did) {
  const s=getSubject(currentSubjectId); if (!s) return;
  const d=(s.drawings||[]).find(x=>x.id===did); if (!d) return;
  if (!canvas) initCanvas();
  const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);pushUndo();showToast('📂 Kresba načtena');switchTab('draw');}; img.src=d.dataUrl;
}
function deleteDrawing(did) {
  const s=getSubject(currentSubjectId); if (!s) return;
  s.drawings=(s.drawings||[]).filter(d=>d.id!==did);
  save(); renderDrawList(); showToast('🗑️ Kresba smazána');
}

// ══ SUBJECT MODAL ══
function buildIconPicker() {
  document.getElementById('icon-picker').innerHTML=ICONS.map(ic=>
    `<div class="color-dot${ic===selectedIcon?' selected':''}"
      style="font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:10px;border:2px solid ${ic===selectedIcon?'white':'transparent'}"
      onclick="selectIcon('${ic}',this)">${ic}</div>`).join('');
}
function buildColorPicker() {
  document.getElementById('color-picker').innerHTML=COLORS.map(c=>
    `<div class="color-dot${c===selectedColor?' selected':''}" style="background:${c}" onclick="selectColor('${c}',this)"></div>`).join('');
}
function selectIcon(ic,el){selectedIcon=ic;document.querySelectorAll('#icon-picker>div').forEach(d=>{d.classList.remove('selected');d.style.borderColor='transparent';});el.classList.add('selected');el.style.borderColor='white';}
function selectColor(c,el){selectedColor=c;document.querySelectorAll('#color-picker .color-dot').forEach(d=>d.classList.remove('selected'));el.classList.add('selected');}
function openAddSubject(){editingSubjectId=null;selectedIcon=ICONS[0];selectedColor=COLORS[0];document.getElementById('input-subject-name').value='';document.getElementById('modal-title').textContent='Nový předmět';buildIconPicker();buildColorPicker();document.getElementById('modal-subject').classList.add('open');setTimeout(()=>document.getElementById('input-subject-name').focus(),100);}
function openEditSubject(id){const s=getSubject(id);if(!s)return;editingSubjectId=id;selectedIcon=s.icon;selectedColor=s.color;document.getElementById('input-subject-name').value=s.name;document.getElementById('modal-title').textContent='Upravit předmět';buildIconPicker();buildColorPicker();document.getElementById('modal-subject').classList.add('open');}
function closeModal(){document.getElementById('modal-subject').classList.remove('open');}
function saveSubject(){
  const name=document.getElementById('input-subject-name').value.trim();
  if(!name){showToast('⚠️ Zadejte název');return;}
  if(editingSubjectId){const s=getSubject(editingSubjectId);s.name=name;s.icon=selectedIcon;s.color=selectedColor;if(currentSubjectId===editingSubjectId)document.getElementById('subject-title').textContent=selectedIcon+' '+name;showToast('✅ Předmět upraven');}
  else{subjects.push({id:uid(),name,icon:selectedIcon,color:selectedColor,recordings:[],notes:[],drawings:[]});showToast('✅ Předmět přidán: '+name);}
  save();closeModal();renderHome();renderManage();
}
function deleteSubject(id){if(!confirm('Smazat předmět i se vším obsahem?'))return;subjects=subjects.filter(s=>s.id!==id);save();goHome();showToast('🗑️ Předmět smazán');}

// ══ MANAGE ══
function renderManage(){
  const list=document.getElementById('manage-list');
  if(!subjects.length){list.innerHTML='<div class="empty-state"><div class="empty-icon">📚</div><p>Žádné předměty.</p></div>';return;}
  list.innerHTML=subjects.map(s=>`<div class="manage-item">
    <div class="manage-item-dot" style="background:${s.color}"></div>
    <div style="font-size:20px">${s.icon}</div>
    <div class="manage-item-name">${escHtml(s.name)}</div>
    <div class="manage-item-counts">${(s.recordings||[]).length} nahrávek · ${(s.notes||[]).length} zápisků · ${(s.drawings||[]).length} kreseb</div>
    <button class="btn-secondary" style="padding:8px 12px;font-size:12px" onclick="openEditSubject('${s.id}')">✏️</button>
    <button class="btn-danger-sm" onclick="deleteSubjectFromManage('${s.id}')">🗑️</button>
  </div>`).join('');
}
function deleteSubjectFromManage(id){if(!confirm('Smazat předmět?'))return;subjects=subjects.filter(s=>s.id!==id);save();renderManage();showToast('🗑️ Smazán');}

// ══ UTILS ══
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatDate(d){return d.toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});}
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

document.getElementById('modal-subject').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('input-subject-name').addEventListener('keydown',e=>{if(e.key==='Enter')saveSubject();});

// ══ PWA / OFFLINE ══
window.addEventListener('online', ()=>document.getElementById('offline-bar').classList.remove('show'));
window.addEventListener('offline',()=>document.getElementById('offline-bar').classList.add('show'));
if (!navigator.onLine) document.getElementById('offline-bar').classList.add('show');

let _deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); _deferredInstall = e;
  document.getElementById('install-btn').classList.add('show');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').classList.remove('show');
  showToast('✅ Aplikace nainstalována!');
});
function installApp() {
  if (!_deferredInstall) { showToast('ℹ️ Menu prohlížeče → Přidat na plochu'); return; }
  _deferredInstall.prompt();
  _deferredInstall.userChoice.then(r => {
    if (r.outcome === 'accepted') showToast('✅ Instalace zahájena…');
    _deferredInstall = null;
    document.getElementById('install-btn').classList.remove('show');
  });
}

// ══ SERVICE WORKER (inline jako Blob) ══
// Funguje na https:// (Netlify, GitHub Pages atd.)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const swSrc = [
    "const CACHE='skolni-v2';",
    "const URL_TO_CACHE=self.location.href.replace('sw-blob','');",
    "self.addEventListener('install',e=>{self.skipWaiting();});",
    "self.addEventListener('activate',e=>{",
    "  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));",
    "});",
    "self.addEventListener('fetch',e=>{",
    "  if(e.request.method!=='GET')return;",
    "  e.respondWith(",
    "    caches.match(e.request).then(r=>{",
    "      if(r)return r;",
    "      return fetch(e.request).then(nr=>{",
    "        if(!nr||nr.status!==200||nr.type==='opaque')return nr;",
    "        const clone=nr.clone();",
    "        caches.open(CACHE).then(c=>c.put(e.request,clone));",
    "        return nr;",
    "      });",
    "    })",
    "  );",
    "});"
  ].join('\n');

  const swBlob = new Blob([swSrc], {type:'text/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);

  navigator.serviceWorker.register(swUrl)
    .then(reg => {
      // Cache the page itself on first visit
      if (reg.active || reg.installing) {
        caches.open('skolni-v2').then(c => c.add(location.href));
      }
      console.log('[SW] OK');
    })
    .catch(err => console.warn('[SW] Chyba:', err));
}

// ══ INIT ══
renderHome();
</script>
